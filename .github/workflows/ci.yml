name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with real pysnmp and test extras
        run: python -m pip install -e '.[test]'

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Console entry point smoke test
        run: |
          oh-brother --version
          oh-brother --help

      - name: Pin the pysnmp 7.x v1arch API surface
        run: python -c "from pysnmp.hlapi.v1arch import walk_cmd"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lint tooling
        run: python -m pip install -e '.[dev]'

      # The lint gate is pinned in pyproject.toml ([tool.ruff]); house-style
      # rules (UP031 %-formatting, FURB167 re.M, EXE001) are deliberate
      # suppressions, not oversights. See .aislop/config.yml.
      - name: Lint (ruff)
        run: ruff check .
